# Hibernaut 声明式配置模板（复制为 hibernaut.toml 后填入本机路径与环境变量名）
# 注意：本文件仅存放静态主检出与模板配置，绝不存放动态生成的 worktree 路径（运行态由 SQLite workspaces 表管理）。

[runtime]
db_path = "./hibernaut.db"
memory_root = "./agent_memory"
# 分级并发上限，单位是同时在跑的 Inbox 数，各级同时满足才派发：这里是全局上限；[agents.<id>]（只限这个 agent）、[executors.<id>]（合计引用它的各 agent）与 [projects.<name>] 各可再写
# 可选的 max_concurrency（整数，>= 1；不写 = 只受上层限制；大于全局值时以全局为准并记一条 WARNING）。
# 某一级满额只让受它限制的 Inbox 排队（先到先跑），后面配额有余的 Inbox 照常派发。
max_concurrency = 4
new_event_policy = "defer"   # defer | fold | interrupt
default_agent = "claude"         # [agents.<id>]，或旧写法里作为 agent 的 [executors.<id>]。旧键 default_executor 仍可读
# 执行账本（每个 Run 的档案与 Switchboard 审计）的独立 SQLite 文件；留空 = db_path 同目录的 ledger.db，
# 运行日志写在它旁边的 logs/runs/YYYY-MM-DD/<run_id>.log（14 天或 500 MB 滚动清理）。改动需要重启。
# ledger_db_path = ""
# 后台回收清扫：启动时一轮，之后每隔这么多秒一轮，回收交付时因排队事件、在线会话等被跳过、PR 已合并且已无人使用的 hb-* worktree；
# 门禁与回收方式同交付时的回收，跳过只记日志，回收成功才发一条通知；0 = 关闭
worktree_sweep_interval_seconds = 300.0

[channels]
host = "127.0.0.1"
port = 8080
mcp_enabled = false
mcp_token_env = "HIBERNAUT_MCP_TOKEN"
# 文件 Outbox：每条投递的 Outbox 消息另存为该目录下一个 Markdown 文件（文件名为本地时间到毫秒，按名排序即时间顺序），
# 开头是任务上下文头（任务、来源、inbox_id、会话、执行器、状态、需要人做什么；审批消息附批准 / 拒绝命令）。
# 相对路径以本文件所在目录为准，支持 ~。设置后控制台每条只打一行摘要，文件路径相对本文件所在目录显示
# （目录外在 home 下显示为 ~/...，否则为绝对路径）；Drive / Switchboard 照常投递。
# outbox_dir = "outbox"

# 三层：Executor（[executors.*]，怎么调用一个 CLI / 启动器，没有业务含义）→ Agent（[agents.*]，角色、Skill、模型、权限边界）
# → Inbox 绑定（[[projects.<name>.inbox_bindings]]，哪个 inbox 用哪些 agent）。
# 旧写法仍可用：[executors.<id>] 写 role 或 command 即同时是同名 agent。

[executors.claude]
orca_agent = "claude"
command = "claude"
args = ["-p", "{prompt}", "--output-format", "json"]
# 可选：当 session.executor_id == "claude" 且存在 executor_session_id 时，自动使用原生会话续接参数
resume_args = ["-p", "{prompt}", "--resume", "{executor_session_id}", "--output-format", "json"]
timeout_seconds = 300.0
# 可选：透传本地模型网关（如 yetone/magpie）所需环境变量
# [executors.claude.env]
# ANTHROPIC_BASE_URL = "http://127.0.0.1:8787"

# Claude Code 启动器：只能在本部署文件里声明，事件无法指定。内置 claude（command = "claude"）。
# 启动器自管配置目录、账号、网关或代理，并原样转交模型、effort 与角色参数。
# env 原样传给 Claude Code，写什么网关、token 由运营者决定；daemon 自身环境里的付费凭据与路由变量先剥离，再叠加启动器、执行器的 env。
# [launchers.claude-sg]
# harness = "claude-code"
# command = "claude-sg"         # 部署机 PATH 上的命令名或绝对路径
# [launchers.claude-sg.env]
# HTTPS_PROXY = "http://127.0.0.1:7890"

# billing = "api" 必填：付费调用全部发往外置凭据代理，harness 只拿到占位 key，真实 key 由代理注入。
# 此时启动器或执行器 env 里再写 ANTHROPIC_BASE_URL、ANTHROPIC_API_KEY、ANTHROPIC_AUTH_TOKEN、CLAUDE_CODE_OAUTH_TOKEN
# 或 CLAUDE_CODE_USE_* 云厂商开关，会按配置冲突报错。
# [credential_proxy]
# url = "http://127.0.0.1:9000"   # Claude Code 请求 <url>/proxy/<anthropic_service>/v1/messages
# anthropic_service = "anthropic"

# Claude Code 执行器：不写 role、不写 command，只说用哪个启动器、怎么计费；自己不干活，由 [agents.*] 引用。
# 各项均可热加载，保存后下一次 Run 即使用新值，非法值报错并保留当前配置。
[executors.claude-code]
harness = "claude-code"         # 目前仅支持 claude-code
launcher = "claude"             # [launchers.<name>] 之一
billing = "subscription"        # subscription（用启动器自己的登录，剥离继承来的付费凭据，发现 env 没写明的付费来源即中止）| api（经 [credential_proxy]）
timeout_seconds = 1800.0        # 交互模式下含等人回答的时间
# max_concurrency = 2           # 可选：同时跑这个执行器的 Inbox 上限，跨项目、跨引用它的 agent 合计；只想限某个 agent 就写在 [agents.<id>]。普通 CLI 执行器同样可写。SDE 内置评审算在 SDE 那次 Run 的名额里
# model / effort 也可写在这里作默认值，agent 里写的优先

# 独立评审 agent：派单时设 payload.agent_id = "code-reviewer"（旧键 executor_id 仍可用）。只读评审，返回 pass / changes_requested。
# 旧名 role = "coder-reviewer"、"builtin:coder-reviewer" 仍可用，视为同一角色。
[agents.code-reviewer]
role = "code-reviewer"
executor = "claude-code"
description = "只读评审实际 diff 与测试证据，给出 pass / changes_requested"   # 可选：写进 Steward 的路由清单
model = "claude-opus-5-5"       # 任意非空字符串，原样经 --model 传给 harness：Claude 模型全名、别名 opus / sonnet / haiku / fable，或网关认识的模型名
effort = "high"                 # low | medium | high | xhigh | max
interactive = true              # 需要人可接入的交互会话，由项目的 terminal_backend 打开；缺后端则报告原因、不改走后台。false 走非交互。旧名 visible 仍可读，不可与 interactive 同写
# 可选：本角色的有序 Skill（本地 SKILL.md 或含该文件的目录；相对路径以本文件所在目录为准，可用 ~）。
# 省略时用安装包内置的 "builtin:code-reviewer"；写了则只用所列各项，可把 "builtin:code-reviewer" 列进去再追加。
# 正文与资源目录经 --append-system-prompt 传给评审者；只读权限、结论 schema 与契约由程序控制，Skill 改不了。
# skills = ["builtin:code-reviewer", "./skills/team-review"]

# 经本机模型网关跑非 Claude 模型：执行器的 env 写网关地址与 token，billing 仍用 subscription（不经 [credential_proxy]）。SDE 与 Steward 同样可用。
[executors.model-gateway]
harness = "claude-code"
billing = "subscription"
[executors.model-gateway.env]
ANTHROPIC_BASE_URL = "http://127.0.0.1:3425"
ANTHROPIC_AUTH_TOKEN = "magpie"   # 网关占位 token，真凭据在网关里

[agents.gpt-reviewer]
role = "code-reviewer"
executor = "model-gateway"
model = "codex/gpt-6.2-astra"

# SDE agent：派单时设 payload.agent_id = "sde"。在任务 worktree 内按测试先行开发，交付实现、红绿测试证据与仓库检查结果。
# executor / model / effort 与评审者各自独立配置；review 为运行时开关，保存后下一次执行即使用新值。
[agents.sde]
role = "sde"
executor = "claude-code"
description = "在任务 worktree 里测试先行开发，送评审后交付"
max_concurrency = 2             # 可选：同时跑这个 agent 的 Inbox 上限；满额时共用 claude-code 的 steward 仍可立即运行
model = "claude-opus-5-5"
effort = "high"
review = true                   # true：送 reviewer 评审，changes_requested 时修复后复审，pass 才交付；false：测试与检查完成后直接交付
reviewer = "code-reviewer"      # review = true 时必填有效值：role = "code-reviewer" 的执行器，或任一普通 CLI 执行器（含内置 claude / cursor-agent / grok / dsh）
# reviewer = "grok-reviewer"    # 用 [executors.grok-reviewer] 模板非交互评审：prompt 末尾要求只输出一个 JSON 结论，格式错重试一次；模板写 terminal = "orca" 时在 Orca 终端里可旁观。
#                               # 只读保证较弱：CLI 的工具不受限制，只靠评审前后比对 worktree 指纹，改动了就作废结论并挂起为 review pending。
#                               # 省略 reviewer 且没有名为 code-reviewer 的执行器时，回退用旧名 coder-reviewer 的评审角色执行器。
# reviewer = ["grok-reviewer", "gpt-reviewer"]   # 或写评审候选的有序列表：每个任务第一次评审前按 [availability] 的可用表取第一个可用的，
#                               # 之后各轮、重启、挂起恢复都用它；它报额度用完（quota_errors）才换下一个并重跑这一轮，全不可用则挂起等人。
#                               # 每项规则同单个名字，不能重复；写代码的和评审的别用同一家模型，由这里的列表自己避开。
max_review_rounds = 3           # 第 2 轮起只做增量复核（上一轮没修好的项、之后改动引入的新问题），其余降为跟进；超过轮数仍未通过则保持待处理（Suspend），批准再修一轮，拒绝则标注未评审交付
interactive = true              # 开发对话在交互终端里续接（存活终端或 --resume）；缺后端则挂起并说明原因，批准重试；false 走非交互
# 可选：同上，省略时用内置 "builtin:sde"（测试先行）。各角色只读自己这一节的 skills，SDE 内置评审用评审者那一节的。
# 项目自己的流程不写在这里：放在项目仓库根目录，AGENTS.md 写简短通用约束，guidance.toml 登记各规范文档的路径、适用活动、标签和匹配的文件路径。
# SDE 按派单 payload 的 activities（优先）或 tags / labels 选规范，评审再按 diff 路径补选；规范一律从任务开始时记录的 commit 读取（见 README「Project Guidance」）。
# skills = ["builtin:sde", "~/team-skills/release-notes"]

# Steward agent：项目的前台，读事件后自己答复或转投给别的 agent。每轮在工作目录的 Orca 终端里一次性跑 claude -p，跑完即关，不作
# daemon 子进程；项目 terminal_backend 不是 orca 或 Orca 打不开终端时挂起并说明原因，批准后重试。只读，不建 worktree：没有 Edit / Write / Bash，
# 只有 Read / Grep / Glob、只读 git、读写项目 Memory、查本项目的会话与事件、forward_to_inbox（每次都过 PermissionPort，最多转投 3 次，回投不计）。
# 它能路由到哪些 inbox 和 agent，每次唤醒由本配置现拼进提示，不写在 Skill 里。
[agents.steward]
role = "steward"
executor = "claude-code"
description = "项目前台：分诊、答复、转投、汇总"
model = "claude-sonnet-4-5"
effort = "medium"
checkout_access = "readonly"    # 只能是 readonly（默认值）；steward 总是非交互运行，不能写 interactive = true
skills = ["builtin:steward"]    # 可省略，默认即此项
# workdir = "~/stewards/hibernaut"   # 可选：工作目录（~ 可用，相对路径以本文件所在目录为准），须是 Orca 认得的检出；未写用项目 checkout。多个项目要不同目录就各写一个 steward agent
# branch = "main"               # 可选：每次运行前核对工作目录的当前分支，不一致则挂起说明原因；只核对，不切换

[executors.cursor-agent]
command = "cursor-agent"
args = ["-p"]
timeout_seconds = 300.0

[executors.grok]
command = "grok"
args = ["-p", "{prompt}", "--permission-mode", "plan"]
# resume_args = ["-p", "{prompt}", "--resume", "{executor_session_id}"]
timeout_seconds = 300.0
terminal = "orca"               # 仅作评审者（SDE reviewer = "grok"）时生效：在任务 worktree 的 Orca 终端里跑同一条命令，人可实时旁观；
#                               # 结果从包装脚本写的文件读，不读屏幕；读回后（失败、超时、中断同样）立即关闭终端，不等交付，
#                               # 评审记录留终端句柄与 CLI 会话 ID。CLI 环境里去掉 Orca 的会话登记变量（ORCA_AGENT_HOOK_* 等），
#                               # 否则 Orca 会在新标签里 --resume 这次一次性会话。项目 terminal_backend 不是 orca 或 orca 命令失败时退回子进程，
#                               # 评审结论首行注明 terminal=fallback。可选 none（默认，子进程）| orca。

# 给 SDE 当 CLI 评审者用的 grok：{review_schema} 由评审替换为紧凑的结论 JSON Schema，grok 据此输出
# {"structuredOutput": {...}, "text": "..."} 包装对象；只在评审时替换，作普通执行器时原样传给命令。
[executors.grok-reviewer]
command = "grok"
args = ["-p", "{prompt}", "--permission-mode", "plan", "--json-schema", "{review_schema}"]
timeout_seconds = 900.0
# 可选：额度用完的报错（正则列表，区分大小写，在 stderr 与 stdout 里找）。评审非零退出且命中才算；别的失败照旧等人。
# 命中后这个执行器在 quota_cooldown_seconds 内不被任何任务选中。[executors.<id>] 的 CLI 与 Claude Code 驱动都可写（后者只对
# interactive = false 的评审有效：交互会话没有退出码），用它的 agent 沿用。内置 grok 模板（没写 [executors.grok] 时）自带这一条，别家没有默认值，按见过的原文写。
quota_errors = ['status 402 Payment Required\): Grok Build usage balance exhausted']
# terminal = "orca"             # 可选：在任务 worktree 的 Orca 终端里跑，人可旁观（见 [executors.grok]）

# 可选：可用表，由外面的程序按余量和策略写，Hibernaut 只读，用来选评审候选（reviewer 写成列表时）。格式：
# {"version": 1, "generated_at": "...", "executors": {"grok-reviewer": {"available": false, "reason": "剩余 8%，低于 15%"}}}
# 没列到的算可用；文件缺失或读不懂时全部算可用并记一条日志；不看 generated_at 判过期，沿用旧判断是写的一方的事。
# [availability]
# file = "~/.config/hibernaut/availability.json"   # 支持 ~，相对路径以本文件所在目录为准；不写则全部可用
# quota_cooldown_seconds = 3600   # 报额度用完的执行器多久内不选，默认 60 分钟；记在数据库里，重启仍在

[executors.dsh]
command = "dsh"
args = ["-c"]
timeout_seconds = 300.0

# 普通 CLI 执行器也可以换个名字当 agent（不写 role；model、skills 等只有 Claude Code 角色能写）。
[agents.patrol]
executor = "grok"
description = "巡检与例行检查"

# 系统 Steward 的 agent：照样是只读 steward；接入和补配置的能力来自下面 sys:ops 绑定的 system_tools，不来自 agent。
[agents.hibernaut-ops]
role = "steward"
executor = "model-gateway"
description = "系统 Steward：接入项目、检查和补齐项目配置"
skills = ["builtin:steward"]    # 在带 system_tools 的绑定里换成内置的 steward-system

# 可选：不属于任何项目的 Inbox（sys:* / user:*）。没有项目检出，启动目录 workdir 必填（支持 ~，相对路径以本文件所在目录为准，不自动创建，
# 不存在则事件保持 pending）。键同 [[projects.<name>.inbox_bindings]]，第一个整串匹配的生效；不能与项目的 inbox_id 重叠。
# 可写目录只给一个 Inbox：pattern 须是精确 ID，两条绑定不能指向同一可写目录，也不能在项目检出或 steward 的 workdir 里。
# 可用不带 role 的 CLI agent；checkout_access = "readonly" 的绑定还可用 steward（sde、code-reviewer 拒绝）。
# 没有绑定也不匹配项目的 Inbox，事件保持 pending。规范见 docs/inbox-conventions.md。
[[runtime.inbox_bindings]]
pattern = "sys:patrol"
default_agent = "patrol"
agents = ["patrol"]
workdir = "/absolute/path/to/your/patrol-workdir"
checkout_access = "readwrite"   # readwrite（默认）| readonly：可共享目录、可用正则；CLI 的只读由它自己的参数保证

# 每 15 分钟在脚本目录运行一次磁盘检查。先准备目录和 disk-check.sh（例如内容为 df -Pk .），再启用。
[executors.disk-check]
command = "/bin/sh"
args = ["./disk-check.sh"]

[[runtime.inbox_bindings]]
pattern = "sys:disk-check"
workdir = "/absolute/path/to/your/check-scripts"
checkout_access = "readonly"
default_agent = "disk-check"
agents = ["disk-check"]

[[timers]]
name = "disk-check"
inbox_id = "sys:disk-check"
interval_seconds = 900
enabled = false                 # 默认 true
payload = { volume = "local" }  # 可选，传给脚本的事件数据在 payload.data

# 系统 Steward：接入项目、检查和补齐项目配置（工具 check_projects、onboard_project、complete_project）。改动写进本文件并热加载，
# 原文件留备份；不改执行器、启动器、权限、交付检查和凭据，也不改自己和别的 sys:* 绑定。需求见 docs/requirements/system-steward.md。
[[runtime.inbox_bindings]]
pattern = "sys:ops"
default_agent = "hibernaut-ops"
agents = ["hibernaut-ops"]
workdir = "/absolute/path/to/your/hibernaut"   # 主检出
checkout_access = "readonly"
system_tools = true             # 默认 false。只能写在 pattern 为单个精确 sys:<name>、readonly、agent 全是 steward 的绑定上，否则拒绝加载；
#                               # 这样的 Inbox 不能再转投，只收全局 Steward 替人转来的、绑定群里名单上的人发的、本机运营者投的和它自己的审批
# 系统 Steward 还有只读工具 runtime_status：最近失败和挂起的任务（带等什么）、交付结果、发不出去的消息、各 [[timers]] 最近几次触发和结果。

# 可选：把一个飞书群绑到系统 Inbox，名单上的人在群里发的消息直接进它，答复回群里的同一话题。名单外的人的消息丢弃、不回；
# 没绑定的群照旧（进 Switchboard 路由到的 Inbox，不算人说的）。群里要 @机器人（Switchboard [feishu] group_require_mention）。
# chat_id 从 Switchboard 收到的群消息里取（oc_ 开头）；members 是 open_id（ou_ 开头，单聊事件的 actor）。
# inbox_id 须是上面某条带 system_tools 的绑定的精确 pattern；一个群只能绑一个 Inbox。系统 Steward 改不了这一节。
# 一个系统 Inbox 只绑一个群；它的审批卡发到这个群，只认 members 在这个群里的点击。
# [[feishu_groups]]
# chat_id = "oc_xxx"
# inbox_id = "sys:ops"
# members = ["ou_xxx"]

# 可选：运维 Inbox，给新项目在 Dokploy 上建预发布和生产环境。agent 照样是只读 steward，能力来自绑定的 ops_tools：
# 只有一个 dokploy 工具（跑 [ops_tools] dokploy_script，令牌由脚本从钥匙串取，输出默认打码，不能 --reveal），没有通用命令行。
# 预发布环境直接建、直接部署；部署（含 start、redeploy、开自动部署的来源）到不是预发布的环境、或看不出是哪个环境的，
# 一律以 deploy_production 挂起等审批，批准后由 Hibernaut 执行；删除也挂起。审批卡发到 Switchboard 配的审批聊天。
[agents.infra]
role = "steward"
executor = "model-gateway"
description = "运维：Dokploy 上的预发布和生产环境"
skills = ["builtin:steward"]    # 在带 ops_tools 的绑定里换成内置的 steward-ops

[[runtime.inbox_bindings]]
pattern = "sys:infra"
default_agent = "infra"
agents = ["infra"]
workdir = "/absolute/path/to/your/workspace"   # dokploy 脚本在这里运行
checkout_access = "readonly"
ops_tools = true                # 默认 false。限制同 system_tools（单个精确 sys:<name>、readonly、全 steward、不写 forward_to），
#                               # 不能和 system_tools 写在同一条；同样只收人的请求，不能再转投，不能作定时器或群入口的目标

[ops_tools]
dokploy_script = "~/workspace/skills/dokploy/scripts/dokploy-api.sh"   # 有 ops_tools 绑定时必填；相对路径以本文件所在目录为准
# staging_environments = ["staging"]   # 算预发布的 Dokploy 环境名；别的环境都按生产
# timeout_seconds = 120.0

# 全局 Steward：接个人对话（如飞书单聊），能答的自己答，新活转投到 forward_to 列出的项目。目录以这里的 workdir 为准（Orca 已登记的 Git 检出），
# agent 自己写了 workdir 须是同一个目录。同一个对话派出的每件活各有会话与 worktree。
[[runtime.inbox_bindings]]
pattern = "user:main"
default_agent = "steward"
agents = ["steward"]
workdir = "/absolute/path/to/your/workspace"
checkout_access = "readonly"
forward_to = ["proj:hibernaut", "sys:ops", "sys:infra"]   # 可选：每项是某个项目的主 inbox（inbox_id 的第一个精确 ID）或带 system_tools / ops_tools 的 Inbox，否则拒绝加载；省略则不能转投出本绑定
# repo_tools = true             # 可选，默认 false：多一个 create_repo 工具，在允许的 owner 下建私有仓库，首次提交是 Drive 来源文件夹里
#                               # 最新的文件（压缩包解开）；仓库已存在就停下不覆盖。只能写在精确 ID、readonly、全 steward、不是 sys: 的绑定上

# 写了 repo_tools 时必填，连同下面的 [gdrive] proxy_url、proxy_token_file。gh 用本机的登录，Drive 经凭据代理读，
# 代理配置里须有 sources_folder_id（各项目版本文件夹的上级）。
# [repo_tools]
# owner = "kun-g"              # 未指定账号或组织时的默认值
# allowed_owners = ["kun-g", "LambdaTheory"]  # 须包含默认值。省略时只允许 owner
# max_bytes = 536870912         # 首个版本（下载与解开后）的上限

# 可选：接入项目时可以建标签的仓库 owner。默认空 = 不建，列为待人做
# [onboarding]
# label_owners = ["your-github-name"]

[projects.hibernaut]
# 字符串：一个精确 inbox_id（原有写法，不当正则）。数组：每项直接是正则，须整串匹配（fullmatch），不用加 "re:"（旧写法仍可用）；
# 不含正则语法的项是精确 ID（字面的点写成 "\\."）。第一个精确 ID 是主 inbox，Switchboard 的群聊和仓库路由应指向本项目服务的 inbox。
# 服务多个 inbox 的项目，每个写任务都在该 inbox 自己的 hb-* worktree 里运行。
inbox_id = ["proj:hibernaut", "proj:hibernaut:.+"]
# description = "Always-on Agent 运行时"   # 可选：写进全局 Steward 的路由清单
repo = "kun-g/hibernaut"
checkout = "/absolute/path/to/your/hibernaut"   # 可省略：按 repo 在 Orca 已登记的仓库（orca repo list）里找主检出，找不到或不止一个则加载报错
worktree_backend = "orca"    # orca | git
terminal_backend = "orca"    # orca | none；交互角色会话的后端，与 worktree_backend 独立。默认：orca 项目为 orca，git 项目为 none
orca_create_terminal = false    # agent launch opens its own terminal
handoff = "mcp"              # mcp | peer；Claude Code 角色会话取任务、交结果的方式。peer 需要下面 [peer] 的接收端常驻（hb 启动时检查，不在则启动失败）
# 可选：项目级默认 agent（未设置时回退到 runtime.default_agent）。旧键 executor 仍可读
default_agent = "steward"
# 可选：本项目同时在跑的 Inbox 上限（见 [runtime] max_concurrency）
# max_concurrency = 2

# 可选：Inbox 与 agent 的绑定（M:N）。第一个整串匹配 inbox_id 的绑定生效，选 agent 的顺序：
#   ① payload.agent_id（旧键 executor_id），须在该绑定的 agents 里，否则明确拒绝、不回退  ② 会话已绑定的 agent
#   ③ 绑定的 rules，先匹配者优先  ④ 绑定的 default_agent  ⑤ 项目 default_agent，再到 runtime.default_agent
# 多个 agent 绑同一 inbox（N:1）：共用一把租约锁，串行接力，同一 work_key 用同一 worktree；不同子 inbox 之间并发、worktree 隔离。
# 项目写了绑定后，forward_to_inbox 只能投给有绑定覆盖的 inbox。
[[projects.hibernaut.inbox_bindings]]
pattern = "proj:hibernaut"      # 正则，须整串匹配；不含正则语法即精确 ID
default_agent = "steward"
agents = ["steward", "code-reviewer", "patrol"]   # 白名单；省略则不限
# 条件写几项就须同时满足：source（如 "sb:github"、"timer:<payload 的 timer_name>"）、event_type、tags（payload 的 tags / labels 须包含列出的全部）
rules = [
  { source = "timer:patrol", agent = "patrol" },
  { tags = ["review"], agent = "code-reviewer" },
]

[[projects.hibernaut.inbox_bindings]]
pattern = "proj:hibernaut:sde(:.*)?"
default_agent = "sde"
agents = ["sde", "code-reviewer"]

# 可选：SDE 任务的交付步骤（由 Hibernaut 执行，SDE 只在任务分支本地提交）。不写本节则任务以本地提交结束。
# 授权只来自本部署文件，被改动的仓库改不了；开 PR 与合并分开授权，权限门禁分别是 delivery.open_pr 与 delivery.merge。
# 本项目以「PR 已创建」为默认交付终点：open_pr = true，auto_merge = false（由人合并）。
[projects.hibernaut.delivery]
open_pr = true                  # 合并最新 origin/main、按 change_kind 定版本、跑 checks、推任务分支（不强推）、创建或复用 PR
auto_merge = false              # true：仅在独立评审 pass 且 CI 全部通过后合并，回执记录版本与实际合并 SHA；需 open_pr = true
base_branch = "main"
remote = "origin"
version_file = "src/agent_runtime/__init__.py"   # 版本唯一来源；breaking→major，feature→minor，fix→patch，test_docs→不变
version_pattern = '__version__\s*=\s*"(?P<version>[0-9]+\.[0-9]+\.[0-9]+)"'
title_template = "Hibernaut {version}: {title}"  # 版本未变时只用 title
checks = [["lint-imports"], ["pytest", "-n", "auto", "--dist", "worksteal", "-v"], ["pyright"]]   # 仓库门禁，按序在任务 worktree 运行，任一失败则不推送
check_timeout_seconds = 1800.0
require_review = true           # 合并前要求独立评审 pass
require_ci = true               # 合并前要求 PR 的 CI 全部通过（gh pr checks）
ci_timeout_seconds = 1800.0     # 等 CI 的上限；超时则挂起，批准后再查
ci_poll_seconds = 30.0
merge_method = "squash"         # squash | merge | rebase
max_handbacks = 2               # 合入主干出现版本号以外的冲突、或合入后检查失败时，交回同一 SDE 会话解决（手工解冲突后一律复审两次快照间的变更，检查失败后的修复按增量复审，之后自动续交付）的次数；超过后挂起等人，人批准后重新计数；0 = 直接挂起
close_terminal = true           # 交付有证据后（PR 头即已推送且检查通过的提交；授权合并时须已合并）自动关闭 SDE 终端，并对 CLI 评审者（terminal = "orca"）每次评审后已关闭的终端再关一次兜底；先记下 SHA、PR 与可恢复会话 ID，worktree 不动
delete_branch = true            # PR 合并后删除远端源分支（不强推；已不存在算成功），worktree 回收时一并删除本地分支；false 则都保留
issue_link = "refs"             # 任务来自 GitHub Issue 时 PR 正文开头的一行：closes = `Closes #<n>`（合并进默认分支后关闭 Issue）；refs = `Refs #<n>`（只关联，Issue 保持打开）；none = 不写。跨仓库写 <owner>/<repo>#<n>
# PR 合并后任务自动结案：会话关闭并按回收门禁回收 worktree，被门禁拒绝时只发一条说明原因的通知
# git / gh 由宿主机自己的凭据（gh auth login、git credential helper、SSH agent）或下面的可信包装命令认证；
# Hibernaut 调用前剥离 GH_TOKEN / GITHUB_TOKEN 等变量，进程里不持有 token。
git_command = "git"
gh_command = "gh"

# 可选：handoff = "peer" 的项目所用的 ccpeer 接收端（launchd 常驻，见 deploy/ccpeer/README.md；hb 只读它的收件箱，不启动它）。
# 任务、返工、跟进以 peer 消息发给 Orca 终端里的 Claude Code 会话，会话用 SendMessage 把结果 JSON 发回这个名字。
# [peer]
# receiver = "hibernaut"                 # 接收端名字（python -m ccpeer serve --as <名字>）
# state_dir = "~/.ccpeer"                # 接收端状态根目录；相对路径以本文件目录为准
# config_dirs = ["~/.claude"]            # 会话登记目录；会话启动时清掉 CLAUDE_CONFIG_DIR，所以默认 ~/.claude
# max_resends = 3                        # 结果格式不对时请会话重发的次数，超过则本轮失败
# register_timeout_seconds = 120         # 终端起来后等会话登记的上限
# exit_timeout_seconds = 30              # 交付后发 /exit 等 Claude Code 退出的上限，超时再关终端

# 可选：Google Drive 任务队列入站与回写闭环（将「任务队列」根目录单独共享给 GCP Service Account 邮箱）
# Service Account 密钥只放在外置凭据代理里（sudo deploy/gdrive-proxy/install.sh，见 deploy/gdrive-proxy/README.md），
# Hibernaut 只持有本机 client token，经 CredentialProxyClient 收发队列业务结果。
# [gdrive]
# enabled = true
# proxy_url = "http://127.0.0.1:9100"            # 不填则用 [credential_proxy] url
# proxy_service = "gdrive-queue"
# proxy_token_file = "~/.config/hibernaut/gdrive-proxy.token"   # 须 chmod 600；相对路径以本文件目录为准
# root_folder_id = "your_task_queue_root_folder_id"
# poll_interval_seconds = 30.0
# default_inbox_id = "proj:hibernaut"
# 可选显式覆盖子目录 ID（不填则自动按名称发现：待执行 / 执行中 / 已完成 / 失败，以及可选的 附件）
# pending_folder_id = ""
# in_progress_folder_id = ""
# done_folder_id = ""
# failed_folder_id = ""
# attachments_folder_id = ""
# 任务附件（frontmatter attachments 或正文里 附件/ 内文件的 Drive ID）在 Run 开始时下载到这里。attachments 写文件 ID 或
# 原名，写法三选一、结果相同：a, b；[a, "b"]；attachments: 下逐行 - a。下载位置：
# <目录>/<任务文件 ID>/<附件文件 ID>/<文件名>，目录 0700、文件 0600，任务会话结案或失败后删除。
# 须在所有 worktree 之外；不填 = runtime.db_path 所在目录下的 attachments/。相对路径以本文件目录为准
# attachments_dir = "~/.local/share/hibernaut/attachments"

# GitHub webhooks go to Switchboard. Configure repository routes and [github] require_label in switchboard.toml.
# Stage A: run Switchboard in this process (off by default). Tokens come only from SWITCHBOARD_* env vars,
# which are moved out of the process environment at startup so executor subprocesses do not inherit them.
# [switchboard]
# enabled = true
# mode = "in_process"
# config_path = "switchboard.toml"   # relative to this file
# consumer_id = "hibernaut"
#
# Stage B: connect to a remote Switchboard instead. Needs SWITCHBOARD_RELAY_TOKEN and SWITCHBOARD_MCP_TOKEN.
# [switchboard]
# enabled = true
# mode = "relay"
# relay_url = "wss://switchboard.example.com/ws/relay"
# mcp_url = "https://switchboard.example.com/mcp"
# consumer_id = "hibernaut"
# ca_file = "private-ca.pem"         # optional, relative to this file

# 可选：让 CLI agent 经 Runner 运行（默认关闭，不写这一段时一切照旧）。每次工具调用先经权限策略：放行、拒绝，或挂起
# 整个 Run 等人批准（批准只放行一次参数相同的调用）。只换下 executors 列出的 CLI agent，角色执行器（sde、code-reviewer、
# steward）不变。改这一段要重启（executors 除外）。设计与限制见 docs/runner.md §6、§7。
# [runner]
# enabled = true
# mode = "in_process"                    # in_process：本进程执行 | relay：本进程只调度，由远端节点反向连入执行
# executors = ["claude"]                 # 不填 = 命令名或执行器名为 claude / grok / cursor-agent 的全部 CLI agent（dsh 没有工具钩子）
#                                        # in_process 下其 args / resume_args 不得带 --settings、--permission-mode 等会改掉钩子的参数
# allow_tools = ["Read", "Grep", "Glob", "Edit", "Write"]   # 工具名按各 CLI 的叫法；不在这里也不在内置名单里的工具一律挂起问人
# block_tools = ["WebFetch"]             # 优先于 allow_tools；参数含 rm -rf 等危险内容的调用始终拒绝
# readonly_only = false                  # true = 这些 agent 的每个 Run 都只读，不论事件怎么写
# timeout_seconds = 1800                 # 单次 Run 的硬上限
# node_wait_seconds = 60                 # 没有空槽（relay：或没有节点在线）时最多等多久，超时按执行失败处理
# in_process：
# runner_id = "local"                    # 记入执行账本的节点名
# max_concurrent = 4                     # 不填 = runtime.max_concurrency
# worktree_backend = "git"               # git | orca
# state_dir = "runner"                   # 不填 = runtime.db_path 所在目录下的 runner/；logs_dir 不填 = <state_dir>/logs
# relay：
# listen_host = "127.0.0.1"              # 只说明文 ws；跨网络时前面要有 TLS
# listen_port = 8790
# token_env = "HIBERNAUT_RUNNER_TOKEN"   # 节点共享 token 所在的环境变量，启动时取出并从环境里删除
# token_file = "~/.config/hibernaut/runner-agent.token"   # 与 token_env 二选一：本用户所有、0600、至少 32 个字符；不能与试点共用
# affinity_db_path = "runner/affinity.db"   # 不填 = runtime.db_path 所在目录下的 runner/affinity.db
# 远端只读 Agent 节点（专用执行器 + 加密隧道）的完整配置、验证与回退见 deploy/runner/REMOTE.md。

# 项目记忆（Memory Hub）。不写这一段用下列默认值；改动要重启。同一项目的 Inbox 共用 <memory_root>/projects/<project_key>/。
# 设计与写入策略见 docs/architecture.md §14。
# [memory_hub]
# gc_interval_seconds = 86400            # 机械清理周期；0 = 关闭
# max_note_bytes = 16384
# proposal_ttl_days = 14                 # 未批的提案过期天数
# progress_archive_days = 7              # 会话已结束的 progress 文件多少天后归档
# auto_git_commit = false                # 清理有改动时提交（memory_root 须是 Git 仓库）
# index_dir = "./memory_index"           # 检索索引目录；不填 = memory_root 下的 .index
# [memory_hub.budget]                    # 每轮必载基线的预算，单位为估算 token
# global_instructions = 1500
# project_instructions = 2500
# project_index = 1500
# project_reported = 1000
# total_max_tokens = 6500
# [memory_hub.projects.hibernaut.budget] # 按项目覆盖，没写的项沿用上面
# project_index = 2000
# [memory_hub.inbox_projects]            # inbox_id 归哪个项目；proj:<key> 与 <key>:<任务> 不用写
# "user:main" = "hibernaut"
# [memory_hub.mounts.vault]              # 只读知识库，用 kb://vault/ 引用
# root = "./vault"                       # 相对本文件
# include_globs = ["**/*.md"]
# exclude_globs = ["**/.git/**"]
# [memory_hub.http]                      # 可选的 HTTP 与 MCP 服务；明文，跨主机时前面要有 TLS
# enabled = true
# listen_host = "127.0.0.1"
# listen_port = 8795
# [memory_hub.http.tokens.laptop]
# token_env = "HIBERNAUT_MEMORY_TOKEN_LAPTOP"   # 启动时取出并从环境里删除
# role = "propose"                       # readonly | propose | admin（admin 不能限定项目）
# allowed_projects = ["hibernaut"]
# allow_kb = false                       # 能否读知识库挂载

# 个人人机协作（默认关闭，docs/architecture.md §15）。改 [collaboration] 或 [experts] 需要重启。
# [collaboration]
# enabled = true
# chief_inbox = "user:main"              # 幕僚长的 Inbox，须有一条精确的 [[runtime.inbox_bindings]]；
#                                        # 其 steward 写 skills = ["builtin:steward", "builtin:chief-of-staff"]
# expert_budget_chars = 6500             # 每个专家启动时的记忆预算（字符）
# [collaboration.taskboard]              # 不写则收口卡不能带后续任务，简报里也没有任务
# mcp_url = "https://taskboard.example.com/taskboard/mcp"
# token_env = "HIBERNAUT_TASKBOARD_MCP_TOKEN"   # 启动时取出并从环境里删除
# [collaboration.hub]                    # 态势看板与审批页；明文 HTTP，跨主机时前面要有 TLS
# enabled = true
# listen_host = "127.0.0.1"
# listen_port = 8796
# base_path = ""                         # 放在同域子路径下时写，例如 "/hub"
# token_env = "HIBERNAUT_COLLABORATION_TOKEN"   # 启动时取出并从环境里删除
# reviewer = "owner"                     # 用这个令牌做的批准与确认记在谁名下
# [experts.architect]                    # 共享专家；项目里写 experts = ["architect"] 抽调，
# agent = "pool:architect"               # 须有 [agents."pool:architect"]；项目可再写 expert_readonly_projects = ["workshop"] 只读挂载别的项目记忆
# max_concurrency = 2

# Runner 只读试点（默认关闭，docs/runner.md §9；启用、验证与回退步骤见 deploy/runner/README.md）。打开后只有 inbox_id 这一个
# 任务级 Inbox 改由独立 Runner 上的固定校验程序执行，任务须带 payload.candidate_commit；其他 Inbox 不受影响。
# Relay 只监听 127.0.0.1。令牌文件须为本用户所有、权限 0600。运行中只能改 enabled，改其他项先关闭。
# 与上面的 [runner] 互不依赖，可只开其一；[runner] 为 relay 时两者的端口不能相同。
# [runner_pilot]
# enabled = false
# inbox_id = "hibernaut:runner-pilot"
# runner_id = "mac-pilot"
# project_key = "hibernaut"
# port = 8791
# token_file = "~/.config/hibernaut/runner-relay.token"
# timeout_seconds = 120              # 单次校验上限，最多 600
