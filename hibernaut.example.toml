# Hibernaut 声明式配置模板（复制为 hibernaut.toml 后填入本机路径与环境变量名）
# 注意：本文件仅存放静态主检出与模板配置，绝不存放动态生成的 worktree 路径（运行态由 SQLite workspaces 表管理）。

[runtime]
db_path = "./hibernaut.db"
memory_root = "./agent_memory"
max_concurrency = 4
new_event_policy = "defer"   # defer | fold | interrupt
default_executor = "claude"
poll_mode = "gh"             # gh | api
poll_interval_seconds = 60.0

[channels]
host = "127.0.0.1"
port = 8080
github_webhook_secret_env = "GITHUB_WEBHOOK_SECRET"
github_token_env = "GITHUB_TOKEN"
feishu_app_id_env = "FEISHU_APP_ID"
feishu_app_secret_env = "FEISHU_APP_SECRET"
feishu_verification_token_env = "FEISHU_VERIFICATION_TOKEN"
feishu_default_chat_id = ""
mcp_enabled = false
mcp_token_env = "HIBERNAUT_MCP_TOKEN"

[executors.claude]
orca_agent = "claude"
command = "claude"
args = ["-p", "{prompt}", "--output-format", "json"]
# 可选：当 session.executor_id == "claude" 且存在 executor_session_id 时，自动使用原生会话续接参数
resume_args = ["-p", "{prompt}", "--resume", "{executor_session_id}", "--output-format", "json"]
timeout_seconds = 300.0
# 可选：透传本地模型网关（如 yetone/magpie）所需环境变量
# [executors.claude.env]
# ANTHROPIC_BASE_URL = "http://127.0.0.1:8787"

# 独立评审执行器：派单时设 payload.executor_id = "coder-reviewer"。只读评审，返回 pass / changes_requested。
# 四项运行配置均可热加载，保存后下一次评审即使用新值；非法值或不支持的组合会报错并保留当前配置。
[executors.coder-reviewer]
role = "coder-reviewer"
harness = "claude-code"         # 目前仅支持 claude-code
billing = "subscription"        # subscription（剥离 API Key 环境变量，发现付费凭据即中止）| api（读 daemon 环境里的 ANTHROPIC_API_KEY）
model = "claude-opus-5-5"       # Claude 模型全名或别名 opus / sonnet / haiku / fable
effort = "high"                 # low | medium | high | xhigh | max
timeout_seconds = 1800.0
# 可选：command = "/abs/path/to/claude"；env 不得包含凭据

[executors.cursor-agent]
command = "cursor-agent"
args = ["-p"]
timeout_seconds = 300.0

[executors.grok]
command = "grok"
args = ["-p", "{prompt}"]
# resume_args = ["-p", "{prompt}", "--resume", "{executor_session_id}"]
timeout_seconds = 300.0

[executors.dsh]
command = "dsh"
args = ["-c"]
timeout_seconds = 300.0

[projects.hibernaut]
inbox_id = "proj:hibernaut"
repo = "kun-g/hibernaut"
checkout = "/absolute/path/to/your/hibernaut"
poll_labels = ["hibernaut"]
worktree_backend = "orca"    # orca | git
orca_create_terminal = false    # agent launch opens its own terminal
feishu_chat_id = ""
# 可选：项目级默认执行器（未设置时回退到 runtime.default_executor）
# executor = "claude"
