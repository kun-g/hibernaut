# Hibernaut 声明式配置模板（复制为 hibernaut.toml 后填入本机路径与环境变量名）
# 注意：本文件仅存放静态主检出与模板配置，绝不存放动态生成的 worktree 路径（运行态由 SQLite workspaces 表管理）。

[runtime]
db_path = "./hibernaut.db"
memory_root = "./agent_memory"
max_concurrency = 4
new_event_policy = "defer"   # defer | fold | interrupt
default_executor = "claude"
poll_mode = "gh"             # gh | api
poll_interval_seconds = 60.0

[channels]
host = "127.0.0.1"
port = 8080
github_webhook_secret_env = "GITHUB_WEBHOOK_SECRET"
github_token_env = "GITHUB_TOKEN"
feishu_app_id_env = "FEISHU_APP_ID"
feishu_app_secret_env = "FEISHU_APP_SECRET"
feishu_verification_token_env = "FEISHU_VERIFICATION_TOKEN"
feishu_default_chat_id = ""

[executors.claude]
command = "claude"
args = ["-p"]
timeout_seconds = 300.0
# 可选：透传本地模型网关（如 yetone/magpie）所需环境变量
# [executors.claude.env]
# ANTHROPIC_BASE_URL = "http://127.0.0.1:8787"

[executors.cursor-agent]
command = "cursor-agent"
args = ["-p"]
timeout_seconds = 300.0

[executors.grok]
command = "grok"
args = ["-p"]
timeout_seconds = 300.0

[executors.dsh]
command = "dsh"
args = ["-c"]
timeout_seconds = 300.0

[projects.hibernaut]
inbox_id = "proj:hibernaut"
repo = "kun-g/hibernaut"
checkout = "/absolute/path/to/your/hibernaut"
poll_labels = ["hibernaut"]
worktree_backend = "orca"    # orca | git
orca_create_terminal = false
feishu_chat_id = ""
