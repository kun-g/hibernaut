# Hibernaut 声明式配置模板（复制为 hibernaut.toml 后填入本机路径与环境变量名）
# 注意：本文件仅存放静态主检出与模板配置，绝不存放动态生成的 worktree 路径（运行态由 SQLite workspaces 表管理）。

[runtime]
db_path = "./hibernaut.db"
memory_root = "./agent_memory"
max_concurrency = 4
new_event_policy = "defer"   # defer | fold | interrupt
default_agent = "claude"         # [agents.<id>]，或旧写法里作为 agent 的 [executors.<id>]。旧键 default_executor 仍可读
# 执行账本（每个 Run 的档案与 Switchboard 审计）的独立 SQLite 文件；留空 = db_path 同目录的 ledger.db，
# 运行日志写在它旁边的 logs/runs/YYYY-MM-DD/<run_id>.log（14 天或 500 MB 滚动清理）。改动需要重启。
# ledger_db_path = ""
# 后台回收清扫：启动时一轮，之后每隔这么多秒一轮，回收交付时因排队事件、在线会话等被跳过、PR 已合并且已无人使用的 hb-* worktree；
# 门禁与回收方式同交付时的回收，跳过只记日志，回收成功才发一条通知；0 = 关闭
worktree_sweep_interval_seconds = 300.0

[channels]
host = "127.0.0.1"
port = 8080
mcp_enabled = false
mcp_token_env = "HIBERNAUT_MCP_TOKEN"
# 文件 Outbox：每条投递的 Outbox 消息另存为该目录下一个 Markdown 文件（文件名为本地时间到毫秒，按名排序即时间顺序），
# 开头是任务上下文头（任务、来源、inbox_id、会话、执行器、状态、需要人做什么；审批消息附批准 / 拒绝命令）。
# 相对路径以本文件所在目录为准，支持 ~。设置后控制台每条只打一行摘要，文件路径相对本文件所在目录显示
# （目录外在 home 下显示为 ~/...，否则为绝对路径）；Drive / Switchboard 照常投递。
# outbox_dir = "outbox"

# 三层：Executor（[executors.*]，怎么调用一个 CLI / 启动器，没有业务含义）→ Agent（[agents.*]，角色、Skill、模型、权限边界）
# → Inbox 绑定（[[projects.<name>.inbox_bindings]]，哪个 inbox 用哪些 agent）。
# 旧写法仍可用：[executors.<id>] 写 role 或 command 即同时是同名 agent。

[executors.claude]
orca_agent = "claude"
command = "claude"
args = ["-p", "{prompt}", "--output-format", "json"]
# 可选：当 session.executor_id == "claude" 且存在 executor_session_id 时，自动使用原生会话续接参数
resume_args = ["-p", "{prompt}", "--resume", "{executor_session_id}", "--output-format", "json"]
timeout_seconds = 300.0
# 可选：透传本地模型网关（如 yetone/magpie）所需环境变量
# [executors.claude.env]
# ANTHROPIC_BASE_URL = "http://127.0.0.1:8787"

# Claude Code 启动器：只能在本部署文件里声明，事件无法指定。内置 claude（command = "claude"）。
# 启动器自管配置目录、账号、网关或代理，并原样转交模型、effort 与角色参数。env 不得包含凭据或计费开关。
# [launchers.claude-sg]
# harness = "claude-code"
# command = "claude-sg"         # 部署机 PATH 上的命令名或绝对路径
# [launchers.claude-sg.env]
# HTTPS_PROXY = "http://127.0.0.1:7890"

# billing = "api" 必填：付费调用全部发往外置凭据代理，harness 只拿到占位 key，真实 key 由代理注入。
# [credential_proxy]
# url = "http://127.0.0.1:9000"   # Claude Code 请求 <url>/proxy/<anthropic_service>/v1/messages
# anthropic_service = "anthropic"

# Claude Code 执行器：不写 role、不写 command，只说用哪个启动器、怎么计费；自己不干活，由 [agents.*] 引用。
# 各项均可热加载，保存后下一次 Run 即使用新值，非法值报错并保留当前配置。
[executors.claude-code]
harness = "claude-code"         # 目前仅支持 claude-code
launcher = "claude"             # [launchers.<name>] 之一
billing = "subscription"        # subscription（用启动器自己的登录，剥离付费凭据，发现付费来源即中止）| api（经 [credential_proxy]）
timeout_seconds = 1800.0        # 交互模式下含等人回答的时间
# model / effort 也可写在这里作默认值，agent 里写的优先

# 独立评审 agent：派单时设 payload.agent_id = "code-reviewer"（旧键 executor_id 仍可用）。只读评审，返回 pass / changes_requested。
# 旧名 role = "coder-reviewer"、"builtin:coder-reviewer" 仍可用，视为同一角色。
[agents.code-reviewer]
role = "code-reviewer"
executor = "claude-code"
description = "只读评审实际 diff 与测试证据，给出 pass / changes_requested"   # 可选：写进 Steward 的路由清单
model = "claude-opus-5-5"       # Claude 模型全名或别名 opus / sonnet / haiku / fable
effort = "high"                 # low | medium | high | xhigh | max
interactive = true              # 需要人可接入的交互会话，由项目的 terminal_backend 打开；缺后端则报告原因、不改走后台。false 走非交互。旧名 visible 仍可读，不可与 interactive 同写
# 可选：本角色的有序 Skill（本地 SKILL.md 或含该文件的目录；相对路径以本文件所在目录为准，可用 ~）。
# 省略时用安装包内置的 "builtin:code-reviewer"；写了则只用所列各项，可把 "builtin:code-reviewer" 列进去再追加。
# 正文与资源目录经 --append-system-prompt 传给评审者；只读权限、结论 schema 与契约由程序控制，Skill 改不了。
# skills = ["builtin:code-reviewer", "./skills/team-review"]

# SDE agent：派单时设 payload.agent_id = "sde"。在任务 worktree 内按测试先行开发，交付实现、红绿测试证据与仓库检查结果。
# executor / model / effort 与评审者各自独立配置；review 为运行时开关，保存后下一次执行即使用新值。
[agents.sde]
role = "sde"
executor = "claude-code"
description = "在任务 worktree 里测试先行开发，送评审后交付"
model = "claude-opus-5-5"
effort = "high"
review = true                   # true：送 reviewer 评审，changes_requested 时修复后复审，pass 才交付；false：测试与检查完成后直接交付
reviewer = "code-reviewer"      # review = true 时必填有效值：role = "code-reviewer" 的执行器，或任一普通 CLI 执行器（含内置 claude / cursor-agent / grok / dsh）
# reviewer = "grok-reviewer"    # 用 [executors.grok-reviewer] 模板非交互评审：prompt 末尾要求只输出一个 JSON 结论，格式错重试一次；模板写 terminal = "orca" 时在 Orca 终端里可旁观。
#                               # 只读保证较弱：CLI 的工具不受限制，只靠评审前后比对 worktree 指纹，改动了就作废结论并挂起为 review pending。
#                               # 省略 reviewer 且没有名为 code-reviewer 的执行器时，回退用旧名 coder-reviewer 的评审角色执行器。
max_review_rounds = 3           # 超过轮数仍未通过则保持待处理（Suspend），批准再修一轮，拒绝则标注未评审交付
interactive = true              # 开发对话在交互终端里续接（存活终端或 --resume）；缺后端则挂起并说明原因，批准重试；false 走非交互
# 可选：同上，省略时用内置 "builtin:sde"（测试先行）。各角色只读自己这一节的 skills，SDE 内置评审用评审者那一节的。
# 项目自己的流程不写在这里：放在项目仓库根目录，AGENTS.md 写简短通用约束，guidance.toml 登记各规范文档的路径、适用活动、标签和匹配的文件路径。
# SDE 按派单 payload 的 activities（优先）或 tags / labels 选规范，评审再按 diff 路径补选；规范一律从任务开始时记录的 commit 读取（见 README「Project Guidance」）。
# skills = ["builtin:sde", "~/team-skills/release-notes"]

# Steward agent：项目的前台，读事件后自己答复或转投给别的 agent。在主检出里只读运行，不建 worktree：没有 Edit / Write / Bash，
# 只有 Read / Grep / Glob、只读 git、读写项目 Memory、查本项目的会话与事件、forward_to_inbox（每次都过 PermissionPort，最多 3 跳）。
# 它能路由到哪些 inbox 和 agent，每次唤醒由本配置现拼进提示，不写在 Skill 里。
[agents.steward]
role = "steward"
executor = "claude-code"
description = "项目前台：分诊、答复、转投、汇总"
model = "claude-sonnet-4-5"
effort = "medium"
checkout_access = "readonly"    # 只能是 readonly（默认值）；steward 总是非交互运行，不能写 interactive = true
skills = ["builtin:steward"]    # 可省略，默认即此项

[executors.cursor-agent]
command = "cursor-agent"
args = ["-p"]
timeout_seconds = 300.0

[executors.grok]
command = "grok"
args = ["-p", "{prompt}", "--permission-mode", "plan"]
# resume_args = ["-p", "{prompt}", "--resume", "{executor_session_id}"]
timeout_seconds = 300.0
terminal = "orca"               # 仅作评审者（SDE reviewer = "grok"）时生效：在任务 worktree 的 Orca 终端里跑同一条命令，人可实时旁观；
#                               # 结果从包装脚本写的文件读，不读屏幕。项目 terminal_backend 不是 orca 或 orca 命令失败时退回子进程，
#                               # 评审结论首行注明 terminal=fallback。可选 none（默认，子进程）| orca。

# 给 SDE 当 CLI 评审者用的 grok：{review_schema} 由评审替换为紧凑的结论 JSON Schema，grok 据此输出
# {"structuredOutput": {...}, "text": "..."} 包装对象；只在评审时替换，作普通执行器时原样传给命令。
[executors.grok-reviewer]
command = "grok"
args = ["-p", "{prompt}", "--permission-mode", "plan", "--json-schema", "{review_schema}"]
timeout_seconds = 900.0
# terminal = "orca"             # 可选：在任务 worktree 的 Orca 终端里跑，人可旁观（见 [executors.grok]）

[executors.dsh]
command = "dsh"
args = ["-c"]
timeout_seconds = 300.0

# 普通 CLI 执行器也可以换个名字当 agent（不写 role；model、skills 等只有 Claude Code 角色能写）。
[agents.ops]
executor = "grok"
description = "巡检与例行检查"

[projects.hibernaut]
# 字符串：一个精确 inbox_id（原有写法，不当正则）。数组：每项直接是正则，须整串匹配（fullmatch），不用加 "re:"（旧写法仍可用）；
# 不含正则语法的项是精确 ID（字面的点写成 "\\."）。第一个精确 ID 是主 inbox，Switchboard 的群聊和仓库路由应指向本项目服务的 inbox。
# 服务多个 inbox 的项目，每个写任务都在该 inbox 自己的 hb-* worktree 里运行。
inbox_id = ["proj:hibernaut", "proj:hibernaut:.+"]
repo = "kun-g/hibernaut"
checkout = "/absolute/path/to/your/hibernaut"
worktree_backend = "orca"    # orca | git
terminal_backend = "orca"    # orca | none；交互角色会话的后端，与 worktree_backend 独立。默认：orca 项目为 orca，git 项目为 none
orca_create_terminal = false    # agent launch opens its own terminal
handoff = "mcp"              # mcp | peer；Claude Code 角色会话取任务、交结果的方式。peer 需要下面 [peer] 的接收端常驻（hb 启动时检查，不在则启动失败）
# 可选：项目级默认 agent（未设置时回退到 runtime.default_agent）。旧键 executor 仍可读
default_agent = "steward"

# 可选：Inbox 与 agent 的绑定（M:N）。第一个整串匹配 inbox_id 的绑定生效，选 agent 的顺序：
#   ① payload.agent_id（旧键 executor_id），须在该绑定的 agents 里，否则明确拒绝、不回退  ② 会话已绑定的 agent
#   ③ 绑定的 rules，先匹配者优先  ④ 绑定的 default_agent  ⑤ 项目 default_agent，再到 runtime.default_agent
# 多个 agent 绑同一 inbox（N:1）：共用一把租约锁，串行接力，同一 work_key 用同一 worktree；不同子 inbox 之间并发、worktree 隔离。
# 项目写了绑定后，forward_to_inbox 只能投给有绑定覆盖的 inbox。
[[projects.hibernaut.inbox_bindings]]
pattern = "proj:hibernaut"      # 正则，须整串匹配；不含正则语法即精确 ID
default_agent = "steward"
agents = ["steward", "code-reviewer", "ops"]   # 白名单；省略则不限
# 条件写几项就须同时满足：source（如 "sb:github"、"timer:<payload 的 timer_name>"）、event_type、tags（payload 的 tags / labels 须包含列出的全部）
rules = [
  { source = "timer:ops", agent = "ops" },
  { tags = ["review"], agent = "code-reviewer" },
]

[[projects.hibernaut.inbox_bindings]]
pattern = "proj:hibernaut:sde(:.*)?"
default_agent = "sde"
agents = ["sde", "code-reviewer"]


# 可选：SDE 任务的交付步骤（由 Hibernaut 执行，SDE 只在任务分支本地提交）。不写本节则任务以本地提交结束。
# 授权只来自本部署文件，被改动的仓库改不了；开 PR 与合并分开授权，权限门禁分别是 delivery.open_pr 与 delivery.merge。
# 本项目以「PR 已创建」为默认交付终点：open_pr = true，auto_merge = false（由人合并）。
[projects.hibernaut.delivery]
open_pr = true                  # 合并最新 origin/main、按 change_kind 定版本、跑 checks、推任务分支（不强推）、创建或复用 PR
auto_merge = false              # true：仅在独立评审 pass 且 CI 全部通过后合并，回执记录版本与实际合并 SHA；需 open_pr = true
base_branch = "main"
remote = "origin"
version_file = "src/agent_runtime/__init__.py"   # 版本唯一来源；breaking→major，feature→minor，fix→patch，test_docs→不变
version_pattern = '__version__\s*=\s*"(?P<version>[0-9]+\.[0-9]+\.[0-9]+)"'
title_template = "Hibernaut {version}: {title}"  # 版本未变时只用 title
checks = [["lint-imports"], ["pytest", "-v"], ["pyright"]]   # 仓库门禁，按序在任务 worktree 运行，任一失败则不推送
check_timeout_seconds = 1800.0
require_review = true           # 合并前要求独立评审 pass
require_ci = true               # 合并前要求 PR 的 CI 全部通过（gh pr checks）
ci_timeout_seconds = 1800.0     # 等 CI 的上限；超时则挂起，批准后再查
ci_poll_seconds = 30.0
merge_method = "squash"         # squash | merge | rebase
max_handbacks = 2               # 合入主干出现版本号以外的冲突、或合入后检查失败时，交回同一 SDE 会话解决（再经增量评审后自动续交付）的次数；超过后挂起等人，人批准后重新计数；0 = 直接挂起
close_terminal = true           # 交付有证据后（PR 头即已推送且检查通过的提交；授权合并时须已合并）自动关闭 SDE 终端与 CLI 评审者（terminal = "orca"）留下的评审终端；先记下 SHA、PR 与可恢复会话 ID，worktree 不动
delete_branch = true            # PR 合并后删除远端源分支（不强推；已不存在算成功），worktree 回收时一并删除本地分支；false 则都保留
issue_link = "refs"             # 任务来自 GitHub Issue 时 PR 正文开头的一行：closes = `Closes #<n>`（合并进默认分支后关闭 Issue）；refs = `Refs #<n>`（只关联，Issue 保持打开）；none = 不写。跨仓库写 <owner>/<repo>#<n>
# PR 合并后任务自动结案：会话关闭并按回收门禁回收 worktree，被门禁拒绝时只发一条说明原因的通知
# git / gh 由宿主机自己的凭据（gh auth login、git credential helper、SSH agent）或下面的可信包装命令认证；
# Hibernaut 调用前剥离 GH_TOKEN / GITHUB_TOKEN 等变量，进程里不持有 token。
git_command = "git"
gh_command = "gh"

# 可选：handoff = "peer" 的项目所用的 ccpeer 接收端（launchd 常驻，见 deploy/ccpeer/README.md；hb 只读它的收件箱，不启动它）。
# 任务、返工、跟进以 peer 消息发给 Orca 终端里的 Claude Code 会话，会话用 SendMessage 把结果 JSON 发回这个名字。
# [peer]
# receiver = "hibernaut"                 # 接收端名字（python -m ccpeer serve --as <名字>）
# state_dir = "~/.ccpeer"                # 接收端状态根目录；相对路径以本文件目录为准
# config_dirs = ["~/.claude"]            # 会话登记目录；会话启动时清掉 CLAUDE_CONFIG_DIR，所以默认 ~/.claude
# max_resends = 3                        # 结果格式不对时请会话重发的次数，超过则本轮失败
# register_timeout_seconds = 120         # 终端起来后等会话登记的上限
# exit_timeout_seconds = 30              # 交付后发 /exit 等 Claude Code 退出的上限，超时再关终端

# 可选：Google Drive 任务队列入站与回写闭环（将「任务队列」根目录单独共享给 GCP Service Account 邮箱）
# Service Account 密钥只放在外置凭据代理里（sudo deploy/gdrive-proxy/install.sh，见 deploy/gdrive-proxy/README.md），
# Hibernaut 只持有本机 client token，经 CredentialProxyClient 收发队列业务结果。
# [gdrive]
# enabled = true
# proxy_url = "http://127.0.0.1:9100"            # 不填则用 [credential_proxy] url
# proxy_service = "gdrive-queue"
# proxy_token_file = "~/.config/hibernaut/gdrive-proxy.token"   # 须 chmod 600；相对路径以本文件目录为准
# root_folder_id = "your_task_queue_root_folder_id"
# poll_interval_seconds = 30.0
# default_inbox_id = "proj:hibernaut"
# 可选显式覆盖子目录 ID（不填则自动按名称发现：待执行 / 执行中 / 已完成 / 失败，以及可选的 附件）
# pending_folder_id = ""
# in_progress_folder_id = ""
# done_folder_id = ""
# failed_folder_id = ""
# attachments_folder_id = ""
# 任务附件（frontmatter attachments 或正文里 附件/ 内文件的 Drive ID）在 Run 开始时下载到这里。attachments 写文件 ID 或
# 原名，写法三选一、结果相同：a, b；[a, "b"]；attachments: 下逐行 - a。下载位置：
# <目录>/<任务文件 ID>/<附件文件 ID>/<文件名>，目录 0700、文件 0600，任务会话结案或失败后删除。
# 须在所有 worktree 之外；不填 = runtime.db_path 所在目录下的 attachments/。相对路径以本文件目录为准
# attachments_dir = "~/.local/share/hibernaut/attachments"

# GitHub webhooks go to Switchboard. Configure repository routes and [github] require_label in switchboard.toml.
# Stage A: run Switchboard in this process (off by default). Tokens come only from SWITCHBOARD_* env vars,
# which are moved out of the process environment at startup so executor subprocesses do not inherit them.
# [switchboard]
# enabled = true
# mode = "in_process"
# config_path = "switchboard.toml"   # relative to this file
# consumer_id = "hibernaut"
#
# Stage B: connect to a remote Switchboard instead. Needs SWITCHBOARD_RELAY_TOKEN and SWITCHBOARD_MCP_TOKEN.
# [switchboard]
# enabled = true
# mode = "relay"
# relay_url = "wss://switchboard.example.com/ws/relay"
# mcp_url = "https://switchboard.example.com/mcp"
# consumer_id = "hibernaut"
# ca_file = "private-ca.pem"         # optional, relative to this file
