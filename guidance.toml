# Catalog of Hibernaut's detailed process documents. AGENTS.md (always included) holds the general rules;
# a task receives a document below only when its activities, tags/labels or (for a review) its diff match.

[[docs]]
path = "docs/process/versioning.md"
summary = "Version numbers, change kinds and how a delivery sets the version"
activities = ["versioning", "release"]
tags = ["version", "release"]
paths = ["src/agent_runtime/__init__.py", "pyproject.toml"]

[[docs]]
path = "docs/inbox-conventions.md"
summary = "How inboxes are named, when to share or split them, where dependencies go, and workdirs of inboxes outside projects"
tags = ["inbox", "routing", "steward"]
