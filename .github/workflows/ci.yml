name: CI Architecture Gates

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.tests.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tests
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          FULL_CI_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          args=()
          if [[ "$EVENT_NAME" == pull_request && "$FULL_CI_LABEL" != true ]]; then
            args+=(--base "origin/$BASE_REF")
          fi
          matrix=$(python3 -m scripts.ci_test_matrix "${args[@]}")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  checks:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: Checks ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache dev virtualenv and pyright
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/pyright-python
          key: venv-${{ runner.os }}-py312-${{ hashFiles('pyproject.toml') }}
      - name: Install dev dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -e ".[dev]"
      - name: Run checks
        env:
          LANE: ${{ matrix.lane }}
          MODE: ${{ matrix.mode }}
          TEST_ARGS: ${{ toJSON(matrix.args) }}
        run: |
          set -euo pipefail
          export PATH="$PWD/.venv/bin:$PATH"
          jq -r '.[]' <<< "$TEST_ARGS" > "$RUNNER_TEMP/pytest-args"
          mapfile -t args < "$RUNNER_TEMP/pytest-args"

          run_gate() {
            local label=$1 start=$SECONDS
            shift
            local rc=0
            "$@" > "$RUNNER_TEMP/$label.log" 2>&1 || rc=$?
            echo "$label | $((SECONDS - start)) s | $rc" > "$RUNNER_TEMP/$label.result"
            return "$rc"
          }

          pids=()
          labels=()
          if [[ "$LANE" == 1 ]]; then
            run_gate imports lint-imports & pids+=($!)
            run_gate lint ruff check --output-format=github & pids+=($!)
            run_gate types pyright & pids+=($!)
            labels+=(imports lint types)
          fi
          case "$MODE" in
            parallel) run_gate pytest pytest -n auto --dist worksteal -v "${args[@]}" & pids+=($!); labels+=(pytest) ;;
            serial) run_gate pytest pytest -v "${args[@]}" & pids+=($!); labels+=(pytest) ;;
            skip) echo "No tests affected." >> "$GITHUB_STEP_SUMMARY" ;;
            *) exit 1 ;;
          esac

          rc=0
          for pid in "${pids[@]}"; do wait "$pid" || rc=$?; done
          echo -e 'Gate | Duration | Exit code\n--- | ---: | ---:' >> "$GITHUB_STEP_SUMMARY"
          for label in "${labels[@]}"; do
            echo "::group::$label"
            cat "$RUNNER_TEMP/$label.log"
            echo "::endgroup::"
            cat "$RUNNER_TEMP/$label.result" >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$rc"

  gates:
    needs: [plan, checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful selection and all checks
        env:
          PLAN: ${{ needs.plan.result }}
          CHECKS: ${{ needs.checks.result }}
        run: '[[ "$PLAN" == success && "$CHECKS" == success ]]'
