name: CI Architecture Gates

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: Gate 1 - Static import boundaries (import-linter)
        run: lint-imports
      - name: Gate 2 - Contract & E2E tests (pytest)
        run: pytest -v
      - name: Gate 3 - Strict static typing (pyright)
        run: pyright
