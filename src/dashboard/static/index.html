<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HB · TB · SB 运转看板</title>
<link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="brand-dot" id="liveDot"></div>
      <div style="min-width:0;">
        <h1>HB · TB · SB 运转看板</h1>
        <div class="sub">只读实时观测 · Hibernaut · Taskboard · Switchboard</div>
      </div>
    </div>

    <nav class="seg-nav" id="segNav" data-active="overview" aria-label="页面切换">
      <div class="seg-thumb"></div>
      <button class="seg-btn active" data-view="overview" type="button">总览</button>
      <button class="seg-btn" data-view="details" type="button">详情</button>
    </nav>

    <div class="controls">
      <span class="meta-ts" id="lastUpdated">加载中...</span>
      <select id="pollInterval" title="自动刷新间隔">
        <option value="5000" selected>每 5 秒刷新</option>
        <option value="10000">每 10 秒刷新</option>
        <option value="30000">每 30 秒刷新</option>
        <option value="0">暂停自动刷新</option>
      </select>
      <button class="primary" id="refreshBtn" type="button">立即刷新</button>
    </div>
  </div>

  <!-- SHARED COLLAPSIBLE STATUS / TOPOLOGY BAR (used by both Overview & Details) -->
  <div class="details-topo-wrap" id="sharedTopoWrap">
    <div class="details-topo-collapsed">
      <div class="details-topo-inner">
        <div class="mini-bar" id="miniBar" role="button" tabindex="0" aria-expanded="false" title="点击展开拓扑卡片">加载状态中...</div>
      </div>
    </div>
    <div class="details-topo-expanded">
      <div class="details-topo-inner">
        <div class="topo" id="topoStrip" title="点击收起为精简状态栏"></div>
        <div class="topo-collapse-hint" id="topoCollapseHint">点击卡片区域收起 ▴</div>
      </div>
    </div>
  </div>

  <!-- VIEW 1: OVERVIEW -->
  <main class="view-pane active" id="view-overview">
    <div class="section">
      <div class="sec-head">
        <div class="sec-title">正在运行中的 Run <span class="pill cyan" id="activeRunsCount">0</span></div>
        <span id="concurrencyNote" style="color:var(--text-dim);font-size:12px;"></span>
      </div>
      <div id="activeRunsContainer"></div>
    </div>

    <div class="section" id="attentionSection" style="display:none;">
      <div class="sec-head">
        <div class="sec-title">等待人工介入 / 异常告警 <span class="pill amber" id="attentionCount">0</span></div>
        <a href="/details#events" onclick="goDetails('events'); return false;" style="font-size:12px;">前往事件队列详情 →</a>
      </div>
      <div class="attn-grid" id="attentionContainer"></div>
    </div>
  </main>

  <!-- VIEW 2: DETAILS -->
  <main class="view-pane" id="view-details">
    <div class="tabs" id="tabBar">
      <button class="tab-btn active" data-tab="events" type="button">事件队列 (HB)<span class="tab-count" id="cnt-events">0</span></button>
      <button class="tab-btn" data-tab="deliveries" type="button">交付 PR &amp; Worktrees<span class="tab-count" id="cnt-deliveries">0</span></button>
      <button class="tab-btn" data-tab="tb" type="button">Taskboard (TB)<span class="tab-count" id="cnt-tb">0</span></button>
      <button class="tab-btn" data-tab="sb" type="button">Switchboard (SB)<span class="tab-count" id="cnt-sb">0</span></button>
      <button class="tab-btn" data-tab="ledger" type="button">执行账本 (Ledger)<span class="tab-count" id="cnt-ledger">0</span></button>
      <button class="tab-btn" data-tab="ccpeer" type="button">ccpeer<span class="tab-count" id="cnt-ccpeer">0</span></button>
      <button class="tab-btn" data-tab="outbox" type="button">Outbox 报告<span class="tab-count" id="cnt-outbox">0</span></button>
    </div>

    <!-- Events panel keeps filter controls mounted so typing never loses focus on refresh -->
    <div class="tab-panel active" id="tab-events">
      <div class="panel-box">
        <div class="panel-head">
          <h3>最近 Event Inbox（最新 50 条）</h3>
          <div class="filter-bar">
            <select id="evStatusSel">
              <option value="all">全部状态</option>
              <option value="processing">processing</option>
              <option value="pending">pending</option>
              <option value="done">done</option>
              <option value="failed">failed</option>
              <option value="dropped">dropped</option>
            </select>
            <input id="evSearchInput" type="search" placeholder="筛选 inbox / source / 关键词..." />
          </div>
        </div>
        <div class="tbl-scroll" id="eventsTableWrap"></div>
      </div>
    </div>

    <div class="tab-panel" id="tab-deliveries"></div>
    <div class="tab-panel" id="tab-tb"></div>
    <div class="tab-panel" id="tab-sb"></div>
    <div class="tab-panel" id="tab-ledger"></div>
    <div class="tab-panel" id="tab-ccpeer"></div>
    <div class="tab-panel" id="tab-outbox"></div>
  </main>
</div>

<!-- Detail Slide-over Drawer -->
<div class="drawer-backdrop" id="drawerBackdrop">
  <div class="drawer">
    <div class="drawer-head">
      <h2 id="drawerTitle">详情</h2>
      <button id="drawerClose" type="button">关闭</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </div>
</div>

<script src="/assets/common.js"></script>
<script>
bindDrawerEvents();

const VALID_TABS = new Set(["events", "deliveries", "tb", "sb", "ledger", "ccpeer", "outbox"]);
const state = {
  snap: null,
  view: "overview",
  tab: "events",
  eventStatusFilter: "all",
  eventSearch: "",
  tbStatusFilter: "all",
  topoExpanded: false,
};

function applyRoute(view, tab, push = false) {
  view = view === "details" ? "details" : "overview";
  if (tab && VALID_TABS.has(tab)) state.tab = tab;
  state.view = view;

  const nav = document.getElementById("segNav");
  nav.dataset.active = view;
  nav.querySelectorAll(".seg-btn").forEach(b => b.classList.toggle("active", b.dataset.view === view));

  document.getElementById("view-overview").classList.toggle("active", view === "overview");
  document.getElementById("view-details").classList.toggle("active", view === "details");

  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === state.tab));
  document.querySelectorAll(".tab-panel").forEach(p => p.classList.toggle("active", p.id === `tab-${state.tab}`));

  document.title = view === "details" ? "HB · TB · SB 详情" : "HB · TB · SB 运转看板";

  if (push) {
    const targetUrl = view === "details" ? `/details#${state.tab}` : "/";
    if (location.pathname + location.hash !== targetUrl) {
      history.pushState({ view, tab: state.tab }, "", targetUrl);
    }
  }
}

function goOverview() {
  applyRoute("overview", null, true);
}

function goDetails(tab) {
  applyRoute("details", tab || state.tab, true);
}

function syncFromLocation() {
  const isDetails = location.pathname.startsWith("/details");
  const hashTab = location.hash.replace(/^#/, "");
  applyRoute(isDetails ? "details" : "overview", VALID_TABS.has(hashTab) ? hashTab : state.tab, false);
}

document.getElementById("segNav").addEventListener("click", e => {
  const btn = e.target.closest(".seg-btn");
  if (!btn) return;
  if (btn.dataset.view === "overview") goOverview();
  else goDetails(state.tab);
});

document.getElementById("tabBar").addEventListener("click", e => {
  const btn = e.target.closest(".tab-btn");
  if (!btn) return;
  applyRoute("details", btn.dataset.tab, true);
});

window.addEventListener("popstate", syncFromLocation);
window.addEventListener("hashchange", syncFromLocation);

document.getElementById("evStatusSel").addEventListener("change", e => {
  state.eventStatusFilter = e.target.value;
  if (state.snap) renderEventsTab(state.snap);
});
document.getElementById("evSearchInput").addEventListener("input", e => {
  state.eventSearch = e.target.value;
  if (state.snap) renderEventsTab(state.snap);
});

function setTopoExpanded(expanded) {
  state.topoExpanded = Boolean(expanded);
  const wrap = document.getElementById("sharedTopoWrap");
  const bar = document.getElementById("miniBar");
  wrap.classList.toggle("expanded", state.topoExpanded);
  bar.setAttribute("aria-expanded", String(state.topoExpanded));
}

document.getElementById("miniBar").addEventListener("click", () => setTopoExpanded(true));
document.getElementById("miniBar").addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    setTopoExpanded(true);
  }
});
document.getElementById("topoStrip").addEventListener("click", e => {
  if (e.target.closest("a, button")) return;
  setTopoExpanded(false);
});
document.getElementById("topoCollapseHint").addEventListener("click", () => setTopoExpanded(false));

/* ================= OVERVIEW RENDERERS ================= */

function buildTopologyHtml(snap) {
  const { sb, tb, hb } = snap;
  const sbOk = sb.health && sb.health.ok;
  const tbOk = tb.health && tb.health.ok;
  const hbOk = Boolean(hb.daemon);

  const leases = hb.counts.leases || 0;
  const maxC = hb.config.max_concurrency || 1;
  const pct = Math.min(100, Math.round((leases / maxC) * 100));
  const sbSrcTotal = Object.values(sb.observed_sources || {}).reduce((a, b) => a + b, 0);

  return `
    <div class="svc-card">
      <div class="svc-head">
        <div class="svc-title">Switchboard <span class="svc-tag">SB</span></div>
        ${sbOk
          ? `<span class="pill green">● 在线 · ${sb.health.latency_ms}ms</span>`
          : `<span class="pill red">● 异常 · ${esc(sb.health?.error || "offline")}</span>`}
      </div>
      <div class="svc-kv">
        <div class="kv-item"><span class="kv-label">入口域名</span><span class="kv-val">${esc(sb.url)}</span></div>
        <div class="kv-item"><span class="kv-label">HB Relay 链路</span><span class="kv-val">${sb.hb_relay_connected ? '<span style="color:#4ade80">ESTABLISHED</span>' : '<span style="color:#f87171">未连接</span>'}</span></div>
        <div class="kv-item"><span class="kv-label">GitHub 标签过滤</span><span class="kv-val">${esc(sb.config.require_label || "全部")}</span></div>
        <div class="kv-item"><span class="kv-label">HB侧已收 SB 事件</span><span class="kv-val">${sbSrcTotal} 条 (${Object.entries(sb.observed_sources||{}).map(([k,v])=>k.replace("sb:","")+":"+v).join(", ") || "无"})</span></div>
      </div>
      <div class="svc-foot">
        <div class="pill-row">
          <span class="pill gray">transport: ${esc(sb.config.relay?.transport || "-")}</span>
          <span class="pill gray">approval: ${esc(sb.config.approval_channel || "-")}</span>
        </div>
        <a href="/details#sb" onclick="event.stopPropagation(); goDetails('sb'); return false;" style="font-size:12px;">详情 →</a>
      </div>
    </div>

    <div class="topo-arrow" title="Switchboard ⇄ Taskboard">⇄</div>

    <div class="svc-card">
      <div class="svc-head">
        <div class="svc-title">Taskboard <span class="svc-tag">TB</span></div>
        ${tbOk
          ? `<span class="pill green">● 在线 · ${tb.health.latency_ms}ms</span>`
          : `<span class="pill red">● 异常 · ${esc(tb.health?.error || "offline")}</span>`}
      </div>
      <div class="svc-kv">
        <div class="kv-item"><span class="kv-label">版本 / MCP 延迟</span><span class="kv-val">v${esc(tb.version || "?")} · ${tb.mcp_latency_ms != null ? tb.mcp_latency_ms + "ms" : "-"}</span></div>
        <div class="kv-item"><span class="kv-label">总任务数</span><span class="kv-val">${tb.tasks_total} ${tb.tasks_error ? "(MCP错误)" : ""}</span></div>
        <div class="kv-item"><span class="kv-label">auto_ready 来源</span><span class="kv-val">${esc((tb.config.auto_ready_sources || []).join(", ") || "-")}</span></div>
        <div class="kv-item"><span class="kv-label">Consumer ID</span><span class="kv-val">${esc(tb.config.consumer_id)}</span></div>
      </div>
      <div class="svc-foot">
        <div class="pill-row">
          <span class="pill gray">backlog: ${tb.status_counts.backlog || 0}</span>
          <span class="pill blue">ready: ${tb.status_counts.ready || 0}</span>
          <span class="pill cyan">run: ${tb.status_counts.in_progress || 0}</span>
          <span class="pill green">done: ${tb.status_counts.done || 0}</span>
        </div>
        <a href="/details#tb" onclick="event.stopPropagation(); goDetails('tb'); return false;" style="font-size:12px;">详情 →</a>
      </div>
    </div>

    <div class="topo-arrow" title="Relay / work.ready ⇄ execution.reported">⇄</div>

    <div class="svc-card">
      <div class="svc-head">
        <div class="svc-title">Hibernaut <span class="svc-tag">HB v${esc(hb.version || "?")}</span></div>
        ${hbOk
          ? `<span class="pill green">● 运行中 · PID ${hb.daemon.pid}</span>`
          : `<span class="pill red">● Daemon 未运行</span>`}
      </div>
      <div class="svc-kv">
        <div class="kv-item"><span class="kv-label">Daemon / 监督进程</span><span class="kv-val">${hb.daemon ? `${hb.daemon.etime} (${hb.daemon.mem_mb}MB)` : "down"} · sup ${hb.supervisor ? hb.supervisor.etime : "off"}</span></div>
        <div class="kv-item"><span class="kv-label">ccpeer / 活跃 Worker</span><span class="kv-val">${hb.ccpeer ? `PID ${hb.ccpeer.pid} (${hb.ccpeer.etime})` : "off"} · ${hb.gate_workers_count} gates</span></div>
        <div class="kv-item"><span class="kv-label">事件队列 (Inbox)</span><span class="kv-val">跑 ${hb.counts.events?.processing || 0} · 等 ${hb.counts.events?.pending || 0} · 完 ${hb.counts.events?.done || 0} · 败 ${hb.counts.events?.failed || 0}</span></div>
        <div class="kv-item"><span class="kv-label">PR 交付 / Worktrees</span><span class="kv-val">已合并 ${hb.counts.deliveries?.merged || 0} · PR开 ${hb.counts.deliveries?.pr_open || 0} · WT ${hb.workspaces.length}</span></div>
      </div>
      <div>
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);">
          <span>并发槽位 (worker_leases)</span>
          <span class="mono">${leases} / ${maxC} (${pct}%)</span>
        </div>
        <div class="meter"><div class="meter-fill ${leases >= maxC ? "full" : ""}" style="width:${pct}%"></div></div>
      </div>
    </div>
  `;
}

function renderTopology(snap) {
  document.getElementById("topoStrip").innerHTML = buildTopologyHtml(snap);
}

function renderActiveRuns(snap) {
  const runs = snap.hb.active_runs || [];
  document.getElementById("activeRunsCount").textContent = runs.length;
  document.getElementById("concurrencyNote").textContent =
    `并发上限 ${snap.hb.config.max_concurrency} · 新事件策略 ${snap.hb.config.new_event_policy} · 交接模式 ${snap.hb.config.projects?.[0]?.handoff || "-"}`;

  const el = document.getElementById("activeRunsContainer");
  if (!runs.length) {
    el.innerHTML = `<div class="panel-box"><div class="empty">当前没有正在执行的 Run，Hibernaut 处于休眠待命状态 💤</div></div>`;
    return;
  }

  el.innerHTML = `<div class="runs-grid">` + runs.map(r => `
    <div class="run-card" onclick="openRunDetail('${esc(r.session_id)}')">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
        <div class="run-title">${esc(r.title)}</div>
        <div class="pill-row" style="flex-shrink:0;">
          ${statusPill(r.phase)}
          ${r.stage ? statusPill(r.stage) : ""}
        </div>
      </div>
      <div class="run-meta">
        <span>inbox: <b>${esc(r.inbox_id)}</b></span>
        ${r.branch ? `<span>branch: ${esc(r.branch)}</span>` : ""}
        <span>耗时: ${fmtDurSec(r.elapsed_s)}</span>
        ${r.handbacks ? `<span style="color:#fbbf24">handbacks: ${r.handbacks}</span>` : ""}
      </div>
      <div class="run-meta">
        <span>worker: ${esc(r.worker_id || "-")} ${r.lease_ttl_s != null ? `(租约 ${r.lease_ttl_s}s)` : ""}</span>
        <span>${r.peer_pid ? (r.peer_alive
          ? `<span style="color:#4ade80">● ${esc(r.agent || "cli")} PID ${r.peer_pid} (${r.peer_cpu}% CPU, ${r.peer_mem_mb}MB)</span>`
          : `<span style="color:#f87171">○ PID ${r.peer_pid} 已退出</span>`) : "无绑定进程"}</span>
      </div>
      ${r.child_cmds?.length ? `<div class="run-meta" style="color:#93c5fd;">子进程: ${esc(r.child_cmds[0])}</div>` : ""}
      ${(r.summary || r.prompt_preview) ? `<div class="run-snippet">${esc(r.summary || r.prompt_preview)}</div>` : ""}
    </div>
  `).join("") + `</div>`;
}

function renderAttention(snap) {
  const suspended = (snap.hb.suspended_sessions || []).filter(s => !s.also_open_run);
  const failedEvents = (snap.hb.events || []).filter(e => e.status === "failed");
  const pendingEvents = (snap.hb.events || []).filter(e => e.status === "pending");
  const total = suspended.length + failedEvents.length + pendingEvents.length;

  const sec = document.getElementById("attentionSection");
  if (!total) {
    sec.style.display = "none";
    return;
  }
  sec.style.display = "block";
  document.getElementById("attentionCount").textContent = total;

  const cards = [];
  for (const s of suspended) {
    cards.push(`
      <div class="attn-card">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;">
          <b style="color:#fde68a;">⏸ 挂起等待审批 / 回复</b>
          <span class="mono" style="font-size:11px;color:var(--text-dim);">${fmtAgo(s.updated_at)}</span>
        </div>
        <div style="font-weight:500;">${esc(s.title)}</div>
        <div class="mono" style="font-size:11.5px;color:var(--text-dim);">${esc(s.inbox_id)} · req: ${esc(s.pending_request_id || "-")} · stage: ${esc(s.stage)}</div>
        ${s.question ? `<div style="font-size:12px;color:#e2e8f0;">${esc(s.question)}</div>` : ""}
      </div>
    `);
  }
  for (const e of pendingEvents) {
    cards.push(`
      <div class="attn-card">
        <div style="display:flex;justify-content:space-between;gap:8px;">
          <b style="color:#fbbf24;">⏳ 排队中事件 #${e.seq}</b>
          <span class="mono" style="font-size:11px;color:var(--text-dim);">${fmtAgo(e.occurred_at)}</span>
        </div>
        <div class="mono" style="font-size:11.5px;">${esc(e.inbox_id)} · ${esc(e.source)}</div>
        <div style="font-size:12px;color:var(--text-dim);">${esc(e.subject || e.correlation_key || e.external_id)}</div>
      </div>
    `);
  }
  for (const e of failedEvents) {
    cards.push(`
      <div class="attn-card err">
        <div style="display:flex;justify-content:space-between;gap:8px;">
          <b style="color:#fca5a5;">✕ 失败事件 #${e.seq}</b>
          <span class="mono" style="font-size:11px;color:var(--text-dim);">${fmtAgo(e.occurred_at)}</span>
        </div>
        <div class="mono" style="font-size:11.5px;">${esc(e.inbox_id)} · ${esc(e.source)} · 重试 ${e.attempts} 次</div>
        <div style="font-size:12px;color:#fecaca;">${esc(e.last_error || "未知错误")}</div>
      </div>
    `);
  }
  document.getElementById("attentionContainer").innerHTML = cards.join("");
}

/* ================= DETAILS RENDERERS ================= */

function renderMiniBar(snap) {
  const { sb, tb, hb } = snap;
  document.getElementById("miniBar").innerHTML = `
    <span><b>SB</b> ${sb.health?.ok ? `<span class="pill green">在线 ${sb.health.latency_ms}ms</span>` : `<span class="pill red">异常</span>`} ${sb.hb_relay_connected ? `<span class="pill cyan">Relay OK</span>` : `<span class="pill red">Relay 断</span>`}</span>
    <span style="color:var(--border);">|</span>
    <span><b>TB</b> ${tb.health?.ok ? `<span class="pill green">v${esc(tb.version||"?")} ${tb.health.latency_ms}ms</span>` : `<span class="pill red">异常</span>`} <span class="pill gray">任务 ${tb.tasks_total}</span></span>
    <span style="color:var(--border);">|</span>
    <span><b>HB</b> ${hb.daemon ? `<span class="pill green">v${esc(hb.version||"?")} PID ${hb.daemon.pid}</span>` : `<span class="pill red">离线</span>`} <span class="pill cyan">活跃 Run ${(hb.active_runs||[]).length}/${hb.config.max_concurrency}</span></span>
    <span style="color:var(--border);">|</span>
    <span><b>ccpeer</b> ${hb.ccpeer ? `<span class="pill green">PID ${hb.ccpeer.pid}</span>` : `<span class="pill red">离线</span>`}</span>
    <span class="mini-bar-hint">展开 ▾</span>
  `;
}

function renderEventsTab(snap) {
  const all = snap.hb.events || [];
  document.getElementById("cnt-events").textContent = snap.hb.counts.events_total || all.length;

  const c = snap.hb.counts.events || {};
  const sel = document.getElementById("evStatusSel");
  const labels = {
    all: `全部状态 (${snap.hb.counts.events_total || 0})`,
    processing: `processing (${c.processing || 0})`,
    pending: `pending (${c.pending || 0})`,
    done: `done (${c.done || 0})`,
    failed: `failed (${c.failed || 0})`,
    dropped: `dropped (${c.dropped || 0})`,
  };
  for (const opt of sel.options) {
    if (labels[opt.value]) opt.textContent = labels[opt.value];
  }

  const filtered = all.filter(e => {
    if (state.eventStatusFilter !== "all" && e.status !== state.eventStatusFilter) return false;
    if (state.eventSearch) {
      const q = state.eventSearch.toLowerCase();
      const hay = `${e.inbox_id} ${e.source} ${e.subject} ${e.correlation_key} ${e.last_error || ""}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  document.getElementById("eventsTableWrap").innerHTML = `
    <table>
      <thead><tr><th>#</th><th>时间</th><th>状态</th><th>Inbox</th><th>来源</th><th>内容 / Correlation</th><th>错误</th></tr></thead>
      <tbody>
        ${filtered.length ? filtered.map(e => `

function renderTbTab(snap) {
  const tb = snap.tb;
  document.getElementById("cnt-tb").textContent = tb.tasks_total;
  const tasks = (tb.tasks || []).filter(t => state.tbStatusFilter === "all" || t.status === state.tbStatusFilter);

  document.getElementById("tab-tb").innerHTML = `
    <div class="panel-box">
      <div class="panel-head">
        <h3>Taskboard 任务列表 (${tasks.length} / ${tb.tasks_total})</h3>
        <div class="filter-bar">
          <select onchange="state.tbStatusFilter=this.value; renderTbTab(state.snap);">
            <option value="all" ${state.tbStatusFilter==="all"?"selected":""}>全部 (${tb.tasks_total})</option>
            ${["backlog","ready","in_progress","done","cancelled"].map(s =>
              `<option value="${s}" ${state.tbStatusFilter===s?"selected":""}>${s} (${tb.status_counts[s]||0})</option>`
            ).join("")}
          </select>
        </div>
      </div>
      ${tb.tasks_error ? `<div class="empty" style="color:#fca5a5;">调用 Taskboard MCP 失败：${esc(JSON.stringify(tb.tasks_error))}</div>` : `
      <div class="tbl-scroll">
        <table>
          <thead><tr><th>ID</th><th>状态</th><th>优先级</th><th>Scope</th><th>标题</th><th>Assignee</th><th>阻塞上游</th><th>更新时间</th></tr></thead>
          <tbody>
            ${tasks.length ? tasks.map(t => `
              <tr>
                <td class="mono">${esc(t.task_id)}</td>
                <td>${statusPill(t.status)}</td>
                <td class="mono">P${esc(t.priority)}</td>
                <td class="mono">${esc(t.scope)}</td>
                <td class="cell-wrap"><b>${esc(t.title)}</b>${t.parent_task_id ? `<br><span class="mono" style="color:var(--text-muted)">parent: ${esc(t.parent_task_id)}</span>` : ""}</td>
                <td class="mono">${esc(t.assignee)}</td>
                <td class="mono">${t.incomplete_blocker_count ? `<span class="pill amber">${t.incomplete_blocker_count} 阻塞</span>` : "0"}</td>
                <td class="mono">${fmtTime(t.updated_at)}</td>
              </tr>
            `).join("") : `<tr><td colspan="8" class="empty">Taskboard 在线（v${esc(tb.version||"?")}），当前队列里有 0 个任务。<br>当带 <code>${esc(snap.sb.config.require_label || "hibernaut")}</code> 标签的 GitHub Issue 或 MCP 建单进来时，任务会实时出现在这里。</td></tr>`}
          </tbody>
        </table>
      </div>`}
    </div>
  `;
}

function renderSbTab(snap) {

  const routes = [
    ...Object.entries(sb.config.github_repos || {}).map(([k, v]) => ["GitHub Repo", k, v]),
    ...Object.entries(sb.config.github_owners || {}).map(([k, v]) => ["GitHub Owner", k, v]),
    ...Object.entries(sb.config.feishu_chats || {}).map(([k, v]) => ["Feishu Chat", k, v]),
  ];

  document.getElementById("tab-sb").innerHTML = `
    <div class="two-col">
      <div class="panel-box">
        <div class="panel-head"><h3>Switchboard 路由规则（hub-deploy/switchboard.toml）</h3></div>
        <div class="tbl-scroll">
          <table>
            <thead><tr><th>通道</th><th>匹配键</th><th>目标 Scope</th></tr></thead>
            <tbody>
              ${routes.map(([ch, k, v]) => `
                <tr><td><span class="pill blue">${esc(ch)}</span></td><td class="mono">${esc(k)}</td><td class="mono">${esc(v)}</td></tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      </div>
      <div class="panel-box">
        <div class="panel-head"><h3>Relay 与出站参数</h3></div>
        <div style="padding:12px 14px;" class="svc-kv">
          <div class="kv-item"><span class="kv-label">Relay URL (HB配置)</span><span class="kv-val">${esc(snap.hb.config.relay_url || "-")}</span></div>
          <div class="kv-item"><span class="kv-label">本机 Relay Socket</span><span class="kv-val">${sb.hb_relay_connected ? "ESTABLISHED (" + esc(sb.hb_relay_peer || "443") + ")" : "未建立"}</span></div>
          <div class="kv-item"><span class="kv-label">Heartbeat / Ack Timeout</span><span class="kv-val">${esc(sb.config.relay?.heartbeat_sec ?? "-")}s / ${esc(sb.config.relay?.ack_timeout_sec ?? "-")}s</span></div>
          <div class="kv-item"><span class="kv-label">Max In-Flight</span><span class="kv-val">${esc(sb.config.relay?.max_in_flight ?? "-")}</span></div>
          <div class="kv-item"><span class="kv-label">未匹配策略</span><span class="kv-val">${esc(sb.config.unmatched_policy || "-")}</span></div>
          <div class="kv-item"><span class="kv-label">原路回复通道</span><span class="kv-val">${esc((sb.config.reply_to_origin || []).join(", ") || "-")}</span></div>
        </div>
      </div>
    </div>

    <div class="panel-box">
      <div class="panel-head"><h3>经 Switchboard 转入 HB 的最近事件 (source = sb:*)</h3></div>
      <div class="tbl-scroll">
        <table>
          <thead><tr><th>#</th><th>时间</th><th>状态</th><th>来源</th><th>Inbox</th><th>内容 / Correlation</th><th>说明</th></tr></thead>
          <tbody>
            ${evs.length ? evs.map(e => `
              <tr>
                <td class="mono">${e.seq}</td>
                <td class="mono" style="white-space:nowrap;">${fmtTime(e.occurred_at)} (${fmtAgo(e.occurred_at)})</td>
                <td>${statusPill(e.status)}</td>
                <td class="mono">${esc(e.source)}</td>
                <td class="mono">${esc(e.inbox_id)}</td>
                <td class="cell-wrap">${esc(e.subject || e.correlation_key || "-")}</td>
                <td class="cell-wrap" style="color:var(--text-dim);">${esc(e.last_error || "")}</td>
              </tr>
            `).join("") : `<tr><td colspan="7" class="empty">最近 50 条事件里还没有 sb:* 来源</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>

function renderCcpeerTab(snap) {
  const hb = snap.hb;
  const cc = hb.ccpeer;
  const peers = hb.peer_messages || [];
  const bindings = hb.peer_bindings || [];
  const cursors = hb.peer_cursors || [];
  const aliveCount = bindings.filter(b => b.peer_alive).length;
  document.getElementById("cnt-ccpeer").textContent = `${aliveCount}/${peers.length}`;

  document.getElementById("tab-ccpeer").innerHTML = `
    <div class="two-col">
      <div class="panel-box">
        <div class="panel-head"><h3>ccpeer 常驻接收端</h3>${cc ? `<span class="pill green">● 运行中</span>` : `<span class="pill red">● 未运行</span>`}</div>
        <div style="padding:12px 14px;" class="svc-kv">
          <div class="kv-item"><span class="kv-label">PID / 运行时长</span><span class="kv-val">${cc ? `${cc.pid} · ${cc.etime}` : "-"}</span></div>
          <div class="kv-item"><span class="kv-label">CPU / 内存</span><span class="kv-val">${cc ? `${cc.cpu}% · ${cc.mem_mb} MB` : "-"}</span></div>
          <div class="kv-item"><span class="kv-label">Handoff 模式</span><span class="kv-val">${esc(hb.config.projects?.[0]?.handoff || "-")}</span></div>
          <div class="kv-item"><span class="kv-label">存活 Peer 绑定</span><span class="kv-val">${aliveCount} / ${bindings.length}</span></div>
        </div>
      </div>

      <div class="panel-box">
        <div class="panel-head"><h3>收件箱游标（peer_cursors · ${cursors.length}）</h3></div>
        <div class="tbl-scroll">
          <table>
            <thead><tr><th>Receiver</th><th>Offset</th><th>Log</th><th>更新时间</th></tr></thead>
            <tbody>
              ${cursors.length ? cursors.map(c => `
                <tr>
                  <td class="mono">${esc(c.receiver)}</td>
                  <td class="mono">${c.offset}</td>
                  <td class="mono cell-trunc" title="${esc(c.log)}">${esc(c.log)}</td>
                  <td class="mono" style="white-space:nowrap;">${fmtTime(c.updated_at)}</td>
                </tr>
              `).join("") : `<tr><td colspan="4" class="empty">暂无游标记录</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="panel-box">
      <div class="panel-head"><h3>终端与 Peer 绑定（terminal_bindings · 最近 20 条）</h3></div>
      <div class="tbl-scroll">
        <table>
          <thead><tr><th>状态</th><th>Session</th><th>Peer 名称</th><th>Agent / PID</th><th>CPU / 内存</th><th>更新时间</th></tr></thead>
          <tbody>
            ${bindings.length ? bindings.map(b => `
              <tr>
                <td>${b.peer_pid ? (b.peer_alive ? '<span class="pill green">存活</span>' : '<span class="pill gray">已退出</span>') : '<span class="pill gray">无PID</span>'}</td>
                <td class="mono">${esc(b.session_id)}</td>
                <td class="mono cell-trunc" title="${esc(b.peer_name || "")}">${esc(b.peer_name || "-")}</td>
                <td class="mono">${esc(b.agent || "-")} ${b.peer_pid ? `#${b.peer_pid}` : ""}</td>
                <td class="mono">${b.peer_alive ? `${b.peer_cpu}% / ${b.peer_mem_mb}MB` : "-"}</td>
                <td class="mono" style="white-space:nowrap;">${fmtTime(b.updated_at)} (${fmtAgo(b.updated_at)})</td>
              </tr>
            `).join("") : `<tr><td colspan="6" class="empty">暂无绑定记录</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>

    <div class="panel-box">
      <div class="panel-head"><h3>ccpeer 最近交接消息（peer_messages · ${peers.length}）</h3></div>
      <div class="tbl-scroll">
        <table>
          <thead><tr><th>时间</th><th>Task / Session</th><th>状态</th><th>摘要</th><th>已消费</th></tr></thead>
          <tbody>
            ${peers.length ? peers.map(p => `
              <tr>
                <td class="mono" style="white-space:nowrap;">${fmtTime(p.ts_iso)} (${fmtAgo(p.ts_iso)})</td>
                <td class="mono">${esc(p.task_id || p.from_addr || "-")}</td>
                <td>${p.status ? statusPill(p.status) : statusPill(p.kind)}</td>
                <td class="cell-wrap">${esc(p.summary || "-")}</td>
                <td class="mono">${p.consumed_at ? '<span class="pill green">已消费</span>' : '<span class="pill amber">待消费</span>'}</td>
              </tr>
            `).join("") : `<tr><td colspan="5" class="empty">暂无 ccpeer 消息</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

syncFromLocation();
startPolling(snap => {
  state.snap = snap;
  renderTopology(snap);
  renderActiveRuns(snap);
  renderAttention(snap);
  renderMiniBar(snap);
  renderEventsTab(snap);
  renderDeliveriesTab(snap);

</script>
